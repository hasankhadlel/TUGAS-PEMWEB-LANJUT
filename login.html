<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PK PMII UIN Sunan Gunung Djati Cabang Kota Bandung</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" href="https://placehold.co/32x32/005c97/FFFFFF?text=P" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pmii-blue: #005c97;
            --pmii-darkblue: #004a7c;
            --pmii-yellow: #fdd835;
            --text-primary: #111827;
            --text-secondary: #374151;
            --text-muted: #6b7280;
            --border-color: #d1d5db;
            --input-bg: #f9fafb;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        html { height: 100%; }
        body {
            font-family: 'Poppins', 'Inter', sans-serif;
            background-image: url('img/background-login.jpg');
            background-color: #003355;
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
            color: var(--text-primary);
        }
        body::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(
                135deg,
                rgba(0, 92, 151, 0.7),
                rgba(0, 74, 124, 0.8),
                rgba(253, 216, 53, 0.6),
                rgba(0, 51, 85, 0.85),
                rgba(0, 92, 151, 0.7)
            );
            background-size: 500% 500%;
            opacity: 0.85;
            animation: shimmerBackgroundLogin 20s ease infinite;
            z-index: 0;
        }
        @keyframes shimmerBackgroundLogin {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .login-wrapper {
            background-color: rgba(255, 255, 255, 0.98);
            padding: 2rem 2.5rem;
            border-radius: 1.25rem;
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 450px;
            text-align: center;
            position: relative;
            z-index: 2;
            transform: translateY(20px);
            opacity: 0;
            animation: fadeInUpLogin 0.7s 0.2s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
            overflow: hidden;
        }
        @keyframes fadeInUpLogin {
            to { transform: translateY(0); opacity: 1; }
        }
        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.25rem;
        }
        /* Common styles for all logos to ensure consistent circle size */
        .logo-container img {
            width: 55px; /* All logo circles will be 55px */
            height: 55px; /* All logo circles will be 55px */
            border-radius: 50%;
            box-shadow: var(--shadow-md);
            background-color: rgba(255,255,255,0.2);
            padding: 2px; /* Default padding for the image inside the circle */
            object-fit: contain; /* Ensure images are not cropped, fitting within the circle */
        }
        /* Specific adjustment for UIN Komisariat logo to make it appear slightly larger within its 55x55 circle */
        .logo-uin-img {
            padding: 0px; /* Reduce padding to make the image fill more of the circle */
        }
        .tab-buttons {
            display: flex;
            margin-bottom: 1.5rem;
            border-radius: 0.5rem;
            background-color: var(--input-bg);
            padding: 0.25rem;
            box-shadow: var(--shadow-sm);
        }
        .tab-button {
            flex: 1;
            padding: 0.6rem 0.5rem;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-muted);
            background-color: transparent;
            border: none;
            border-radius: 0.375rem;
            cursor: pointer;
            transition: background-color 0.3s, color 0.3s, box-shadow 0.3s;
        }
        .tab-button.active {
            background-color: var(--pmii-blue);
            color: white;
            box-shadow: var(--shadow-md);
        }
        .tab-button:not(.active):hover {
            background-color: #e5e7eb;
            color: var(--pmii-darkblue);
        }
        .login-form-container {
            transition: opacity 0.4s ease-in-out, transform 0.4s ease-in-out;
        }
        .login-form-container.hidden-form {
            opacity: 0;
            transform: translateX(30px);
            max-height: 0;
            overflow: hidden;
            position: absolute;
            pointer-events: none;
            width: calc(100% - 5rem);
        }
         .login-form-container.active-form {
            opacity: 1;
            transform: translateX(0);
            position: relative;
            max-height: none;
            overflow: visible;
            pointer-events: auto;
        }
        .login-title {
            font-size: 1.625rem;
            font-weight: 700;
            color: var(--pmii-darkblue);
            margin-bottom: 0.5rem;
        }
        .login-subtitle {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
        }
        .input-group {
            position: relative;
            margin-bottom: 1.25rem;
        }
        .input-field {
            width: 100%;
            padding: 0.8rem 0.8rem 0.8rem 3rem;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-primary);
            transition: border-color 0.2s ease-in-out, box-shadow 0.2s ease-in-out, background-color 0.2s ease-in-out;
            box-shadow: var(--shadow-sm);
            background-color: rgba(249,250,251,0.8);
            position: relative;
            z-index: 1;
        }
        .input-field:focus {
            border-color: var(--pmii-blue);
            box-shadow: 0 0 0 3px rgba(0, 92, 151, 0.2);
            outline: none;
            background-color: white;
        }
        .input-label {
            position: absolute;
            left: 3rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.875rem;
            transition: top 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                        left 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                        font-size 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                        color 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                        background-color 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            z-index: 0;
            background-color: transparent;
            padding: 0 0.25rem;
        }
        .input-field:focus + .input-label,
        .input-field.has-value + .input-label {
            top: -0.6rem;
            left: 0.6rem;
            font-size: 0.65rem;
            color: var(--pmii-blue);
            z-index: 2;
            background-color: white;
            border-radius: 0.25rem;
        }
        .input-icon {
            position: absolute;
            left: 0.9rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.9rem;
            z-index: 2;
            transition: color 0.2s ease-in-out;
        }
        .input-field:focus ~ .input-icon {
            color: var(--pmii-blue);
        }
        .login-button {
            width: 100%;
            background-image: linear-gradient(to right, var(--pmii-blue), var(--pmii-darkblue));
            color: white;
            font-weight: 600;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 92, 151, 0.25);
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }
        .login-button:hover {
            background-image: linear-gradient(to right, var(--pmii-darkblue), #003355);
            box-shadow: 0 5px 15px rgba(0, 92, 151, 0.35);
            transform: translateY(-2px);
        }
        .login-button:active {
            transform: translateY(0px);
            box-shadow: 0 3px 10px rgba(0, 92, 151, 0.25);
        }
        .login-button .button-text {
            transition: opacity 0.2s ease-out;
        }
        .login-button .spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            opacity: 0;
            transition: opacity 0.2s ease-out;
        }
        .login-button.loading .button-text {
            opacity: 0;
        }
        .login-button.loading .spinner {
            opacity: 1;
        }
        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
        .error-message {
            background-color: rgba(239, 68, 68, 0.15);
            color: #b91c1c;
            padding: 0.6rem 0.8rem;
            border-radius: 0.5rem;
            font-size: 0.8rem;
            margin-bottom: 1.25rem;
            border: 1px solid rgba(239, 68, 68, 0.3);
            display: flex;
            align-items: center;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out, opacity 0.3s ease-out, margin-bottom 0.3s ease-out;
        }
        .error-message.show {
            max-height: 80px;
            opacity: 1;
            margin-bottom: 1.25rem;
        }
        .error-message i {
            margin-right: 0.4rem;
        }
        .form-links {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
            font-size: 0.8rem;
        }
        .form-links a {
            color: var(--pmii-blue);
            text-decoration: none;
            transition: color 0.2s;
        }
        .form-links a:hover {
            color: var(--pmii-darkblue);
            text-decoration: underline;
        }
        .register-link-container {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }
        .btn-modern {
            padding: 0.6rem 1.2rem; border-radius: 0.5rem; font-weight: 600;
            font-size: 0.8rem; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex; align-items: center; justify-content: center;
            cursor: pointer; border: none;
            box-shadow: var(--shadow-sm);
        }
        .btn-modern:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: var(--shadow-md);
        }
        .btn-modern:active { transform: translateY(0px) scale(0.98); }
        .btn-secondary-modern {
            background-color: var(--pmii-yellow); color: var(--pmii-darkblue);
        }
        .btn-secondary-modern:hover { background-color: #fbc02d; }

        .shape {
            position: absolute;
            background-color: rgba(253, 216, 53, 0.05);
            border-radius: 50%;
            animation: floatLogin 25s infinite linear;
            z-index: 1;
        }
        .shape1 { width: 130px; height: 130px; top: -40px; left: -40px; animation-duration: 27s; opacity: 0.5; }
        .shape2 { width: 180px; height: 180px; bottom: -70px; right: -70px; animation-duration: 23s; animation-delay: -6s; background-color: rgba(253, 216, 53, 0.07); opacity: 0.6;}
        .shape3 { width: 90px; height: 90px; top: 25%; right: -25px; animation-duration: 30s; background-color: rgba(0, 92, 151, 0.04); opacity: 0.4;}
        .shape4 { width: 110px; height: 110px; bottom: 20%; left: -35px; animation-duration: 20s; animation-delay: -12s; background-color: rgba(0, 92, 151, 0.05); opacity: 0.5;}

        @keyframes floatLogin {
            0% { transform: translateY(0px) rotate(0deg) scale(0.9); opacity: 0.6; }
            25% { transform: translateY(-15px) rotate(70deg) scale(1); opacity: 0.8; }
            50% { transform: translateY(0px) rotate(140deg) scale(0.9); opacity: 0.6; }
            75% { transform: translateY(15px) rotate(210deg) scale(1); opacity: 0.8; }
            100% { transform: translateY(0px) rotate(360deg) scale(0.9); opacity: 0.6; }
        }
         @keyframes shakeHorizontal {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        .shake {
            animation: shakeHorizontal 0.5s;
        }
    </style>
</head>
<body>
    <div class="shape shape1"></div>
    <div class="shape shape2"></div>
    <div class="shape shape3"></div>
    <div class="shape shape4"></div>

    <div class="login-wrapper">
        <div class="logo-container">
            <img src="img/logo-pmii.png" alt="Logo PMII">
            <!-- Logo Komisariat UIN Sunan Gunung Djati Bandung -->
            <img src="img/logo-komisariat-uin.png" alt="Logo Komisariat UIN SGD" class="logo-uin-img">
        </div>

        <div class="tab-buttons">
            <button type="button" id="admin-tab-button" class="tab-button">Login Admin</button>
            <button type="button" id="kader-tab-button" class="tab-button">Login Kader</button>
        </div>

        <div id="admin-login-section" class="login-form-container hidden-form">

                </div>
                <div class="input-group">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="admin-password" name="admin-password" class="input-field" required>
                    <label for="admin-password" class="input-label">Password</label>
                </div>
                <div class="form-links">
                    <a href="lupa-password.html?type=admin">Lupa Password?</a>

                <button type="submit" class="login-button mt-4" id="admin-login-submit-button">

                    <div class="spinner"></div>
                </button>
            </form>
        </div>

        <div id="kader-login-section" class="login-form-container hidden-form">
            <h1 class="login-title">Login Kader</h1>
            <p class="login-subtitle">Masuk untuk mengakses fitur khusus kader.</p>
            <form id="kader-login-form">
                 <div id="kader-login-error-msg" class="error-message">
                    <i class="fas fa-exclamation-triangle"></i>
                    <span id="kader-error-text">NIM atau password tidak valid.</span>
                </div>
                <div class="input-group">
                    <i class="fas fa-id-card input-icon"></i>
                    <input type="text" id="kader-nim" name="kader-nim" class="input-field" required>
                    <label for="kader-nim" class="input-label">NIM (Nomor Induk Mahasiswa)</label>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="kader-password" name="kader-password" class="input-field" required>
                    <label for="kader-password" class="input-label">Password</label>
                </div>
                 <div class="form-links">
                    <a href="lupa-password.html?type=kader">Lupa Password?</a>
                </div>
                <button type="submit" class="login-button mt-4" id="kader-login-submit-button">
                    <span class="button-text">Login Kader <i class="fas fa-sign-in-alt ml-2"></i></span>

                </button>

            <div class="register-link-container text-center mt-6">

                <a href="register-kader.html" class="btn-modern btn-secondary-modern mt-2 text-sm w-full md:w-auto">
                    <i class="fas fa-user-plus mr-2"></i>Daftar Sebagai Kader
                </a>
            </div>
        </div>
         <a href="index.html" class="block text-center mt-8 text-xs text-pmii-darkblue hover:text-pmii-blue hover:underline">
            <i class="fas fa-arrow-left mr-1"></i> Kembali ke Halaman Utama
        </a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const adminTabButton = document.getElementById('admin-tab-button');
            const kaderTabButton = document.getElementById('kader-tab-button');
            const adminLoginSection = document.getElementById('admin-login-section');
            const kaderLoginSection = document.getElementById('kader-login-section');

            const adminLoginForm = document.getElementById('admin-login-form');
            const adminErrorMessageContainer = document.getElementById('admin-login-error-msg');
            const adminErrorText = document.getElementById('admin-error-text');
            const adminUsernameInput = document.getElementById('admin-username');
            const adminPasswordInput = document.getElementById('admin-password');
            const adminLoginButton = document.getElementById('admin-login-submit-button');

            const kaderLoginForm = document.getElementById('kader-login-form');
            const kaderErrorMessageContainer = document.getElementById('kader-login-error-msg');
            const kaderErrorText = document.getElementById('kader-error-text');
            const kaderNimInput = document.getElementById('kader-nim');
            const kaderPasswordInput = document.getElementById('kader-password');
            const kaderLoginButton = document.getElementById('kader-login-submit-button');
            
            const loginWrapper = document.querySelector('.login-wrapper');

            // Simpan URL halaman sebelumnya saat halaman login diakses
            // Kecuali jika halaman sebelumnya adalah halaman login itu sendiri
            if (document.referrer && !document.referrer.includes('login.html')) {
                sessionStorage.setItem('lastPageBeforeLogin', document.referrer);
            }

            function switchTab(activeTabButton, inactiveTabButton, activeSection, inactiveSection) {
                activeTabButton.classList.add('active');
                inactiveTabButton.classList.remove('active');
                
                activeSection.classList.remove('hidden-form');
                activeSection.classList.add('active-form');
                
                inactiveSection.classList.add('hidden-form');
                inactiveSection.classList.remove('active-form');
            }

            if (adminTabButton && kaderTabButton && adminLoginSection && kaderLoginSection) {
                adminTabButton.addEventListener('click', () => {
                    switchTab(adminTabButton, kaderTabButton, adminLoginSection, kaderLoginSection);
                });
                kaderTabButton.addEventListener('click', () => {
                    switchTab(kaderTabButton, adminTabButton, kaderLoginSection, adminLoginSection);
                });
                
                const urlParams = new URLSearchParams(window.location.search);
                const activeTab = urlParams.get('tab');
                if (activeTab === 'kader') {
                    switchTab(kaderTabButton, adminTabButton, kaderLoginSection, adminLoginSection);
                } else {
                    switchTab(adminTabButton, kaderTabButton, adminLoginSection, kaderLoginSection);
                }
            }


            const inputs = document.querySelectorAll('.input-field');
            inputs.forEach(input => {
                const updateLabelClass = () => {
                    if (input.value.trim() !== '') {
                        input.classList.add('has-value');
                    } else {
                        input.classList.remove('has-value');
                    }
                };
                updateLabelClass();
                input.addEventListener('input', updateLabelClass);
                input.addEventListener('blur', updateLabelClass);
            });

            const exampleAdmins = {
                "adminkomisariat.pmii": { password: "komisariatPMII777!", role: "komisariat", nama: "Admin Utama Komisariat" },

                "adminrayon.ftk": { password: "rayonFTK456$", role: "rayon", nama: "Admin Rayon Tarbiyah", namaRayon: "Rayon Tarbiyah dan Keguruan", fakultas: "Fakultas Tarbiyah dan Keguruan", kodeRayon: "rayon_ftk" },
                "adminrayon.syariah": { password: "rayonSYARIAH!", role: "rayon", nama: "Admin Rayon Syariah", namaRayon: "Rayon Syariah dan Hukum", fakultas: "Fakultas Syariah dan Hukum", kodeRayon: "rayon_syariah" },
                "adminrayon.dakwah": { password: "rayonDAKWAH@", role: "rayon", nama: "Admin Rayon Dakwah", namaRayon: "Rayon Dakwah dan Komunikasi", fakultas: "Fakultas Dakwah dan Komunikasi", kodeRayon: "rayon_dakwah" },
                "adminrayon.adab": { password: "rayonADAB#", role: "rayon", nama: "Admin Rayon Adab", namaRayon: "Rayon Adab dan Humaniora", fakultas: "Fakultas Adab dan Humaniora", kodeRayon: "rayon_adab" },
                "adminrayon.psikologi": { password: "rayonPSIKO$", role: "rayon", nama: "Admin Rayon Psikologi", namaRayon: "Rayon Psikologi", fakultas: "Fakultas Psikologi", kodeRayon: "rayon_psikologi" },
                "adminrayon.saintek": { password: "rayonSAINTEK%", role: "rayon", nama: "Admin Rayon Saintek", namaRayon: "Rayon Sains dan Teknologi", fakultas: "Fakultas Sains dan Teknologi", kodeRayon: "rayon_saintek" },
                "adminrayon.fisip": { password: "rayonFISIP^", role: "rayon", nama: "Admin Rayon FISIP", namaRayon: "Rayon Ilmu Sosial dan Ilmu Politik", fakultas: "Fakultas Ilmu Sosial dan Ilmu Politik", kodeRayon: "rayon_fisip" },
                "adminrayon.febi": { password: "rayonFEBI&", role: "rayon", nama: "Admin Rayon FEBI", namaRayon: "Rayon Ekonomi dan Bisnis Islam", fakultas: "Fakultas Ekonomi dan Bisnis Islam", kodeRayon: "rayon_febi" }
            };
            
            let exampleKaders = JSON.parse(localStorage.getItem('exampleKaders')) || {
                "1217050001": { password: "password123", nama: "Mahbub Junaidi", nim: "1217050001", role: "kader", rayon: "Rayon Ushuluddin", email: "mahbub.j@example.com"},
                "1217050002": { password: "password456", nama: "Nabila Azzahra", nim: "1217050002", role: "kader", rayon: "Rayon Tarbiyah", email: "nabila.a@example.com"},
                "1217050003": { password: "password789", nama: "Rahmat Hidayat", nim: "1217050003", role: "kader", rayon: "Rayon Dakwah", email: "rahmat.h@example.com"},
                "1217050004": { password: "kaderjaya", nama: "Ani Suryani", nim: "1217050004", role: "kader", rayon: "Rayon Syariah dan Hukum", email: "ani.s@example.com"},
                "1217050005": { password: "pmiikuat", nama: "Bambang Susilo", nim: "1217050005", role: "kader", rayon: "Rayon Adab dan Humaniora", email: "bambang.s@example.com"}
            };
            localStorage.setItem('exampleKaders', JSON.stringify(exampleKaders));

            // Fungsi untuk mengarahkan pengguna setelah login
            // Parameter defaultAdminPage dan defaultKaderPage tidak lagi digunakan untuk tujuan pengalihan ini
            function redirectToAppropriatePage() {
                const lastPage = sessionStorage.getItem('lastPageBeforeLogin');
                let targetPage = 'index.html'; // Halaman default jika tidak ada riwayat

                if (lastPage) {
                    // Jika ada halaman sebelumnya yang disimpan, arahkan ke sana
                    targetPage = lastPage;
                    sessionStorage.removeItem('lastPageBeforeLogin'); // Hapus setelah digunakan
                } else {
                    // Jika tidak ada halaman sebelumnya, selalu arahkan ke index.html
                    targetPage = 'index.html';
                }

                try {
                    const baseUrl = window.location.origin + window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);
                    const redirectUrl = new URL(targetPage, baseUrl);
                    window.location.assign(redirectUrl.href);
                } catch (urlError) {
                    window.location.assign(targetPage);
                }
            }


            if(adminLoginForm) {
                adminLoginForm.addEventListener('submit', function(e) {
                    e.preventDefault();
                    if(adminLoginButton) adminLoginButton.classList.add('loading');
                    if(adminErrorMessageContainer) adminErrorMessageContainer.classList.remove('show');

                    setTimeout(() => {
                        const username = adminUsernameInput ? adminUsernameInput.value.trim() : "";
                        const password = adminPasswordInput ? adminPasswordInput.value : "";
                        const user = exampleAdmins[username];

                        if (user && user.password === password) {
                            localStorage.setItem('isAdminLoggedIn', 'true');
                            localStorage.setItem('loggedInUser', JSON.stringify(user));
                            
                            // Panggil fungsi redirect tanpa parameter halaman default spesifik
                            redirectToAppropriatePage();

                        } else {
                            if(adminErrorText) adminErrorText.textContent = "Username atau password admin tidak valid.";
                            if(adminErrorMessageContainer) adminErrorMessageContainer.classList.add('show');
                            if(loginWrapper) loginWrapper.classList.add('shake');
                            setTimeout(() => { if(loginWrapper) loginWrapper.classList.remove('shake'); }, 500);
                            if (adminUsernameInput) adminUsernameInput.focus();
                        }
                        if(adminLoginButton) adminLoginButton.classList.remove('loading');
                    }, 700);
                });
            }

            if(kaderLoginForm) {
                 kaderLoginForm.addEventListener('submit', function(e) {
                    e.preventDefault();
                    if(kaderLoginButton) kaderLoginButton.classList.add('loading');
                    if(kaderErrorMessageContainer) kaderErrorMessageContainer.classList.remove('show');

                    setTimeout(() => {
                        const nim = kaderNimInput ? kaderNimInput.value.trim() : "";
                        const password = kaderPasswordInput ? kaderPasswordInput.value : "";
                        const kader = exampleKaders[nim];

                        if (kader && kader.password === password) {
                            // Mengganti isKaderLoggedIn menjadi isAdminLoggedIn agar konsisten dengan pengajuan-surat.html
                            localStorage.setItem('isAdminLoggedIn', 'true');
                            localStorage.setItem('loggedInUser', JSON.stringify(kader));
                            
                            // Panggil fungsi redirect tanpa parameter halaman default spesifik
                            redirectToAppropriatePage();
                        } else {
                            if(kaderErrorText) kaderErrorText.textContent = "NIM atau password kader tidak valid.";
                            if(kaderErrorMessageContainer) kaderErrorMessageContainer.classList.add('show');
                            if(loginWrapper) loginWrapper.classList.add('shake');
                            setTimeout(() => { if(loginWrapper) loginWrapper.classList.remove('shake'); }, 500);
                            if(kaderNimInput) kaderNimInput.focus();
                        }
                        if(kaderLoginButton) kaderLoginButton.classList.remove('loading');
                    }, 700);
                });
            }
        });
    </script>
</body>
</html>
