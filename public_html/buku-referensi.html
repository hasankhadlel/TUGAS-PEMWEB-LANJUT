<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perpustakaan Digital - Buku Referensi</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts: Poppins & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pmii-blue: #005c97;
            --pmii-darkblue: #004a7c;
            --pmii-yellow: #fdd835;
            --text-primary: #111827;
            --text-secondary: #374151;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --background-page: #f3f4f6;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        body {
            font-family: 'Poppins', 'Inter', sans-serif;
            background-color: var(--background-page);
            color: var(--text-primary);
        }
        .internal-header { background-color: white; box-shadow: var(--shadow-md); border-bottom: 1px solid var(--border-color); }
        .logo-text { color: var(--pmii-blue); }
        #auth-info-header { background-color: var(--pmii-blue); color: white; padding: 0.6rem 1.2rem; border-radius: 0.5rem; transition: all 0.25s; font-weight: 500; }
        #auth-info-header:hover { background-color: var(--pmii-darkblue); transform: translateY(-2px); }
        #auth-info-header.logout-active { background-color: #ef4444 !important; }
        #auth-info-header.logout-active:hover { background-color: #dc2626 !important; }
        .page-title { color: var(--pmii-darkblue); font-weight: 800; }
        .btn { padding: 0.6rem 1.25rem; border-radius: 0.5rem; font-weight: 600; font-size: 0.9rem; transition: all 0.25s; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; text-decoration: none; box-shadow: var(--shadow-sm); }
        .btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .btn:disabled { background-color: #9ca3af; cursor: not-allowed; }
        .btn-primary { background-color: var(--pmii-blue); color: white; }
        .btn-primary:hover:not(:disabled) { background-color: var(--pmii-darkblue); }
        .btn-danger { background-color: #ef4444; color: white; }
        .btn-danger:hover { background-color: #dc2626; }
        
        .book-card { background-color: white; border-radius: 0.75rem; overflow: hidden; box-shadow: var(--shadow-md); transition: transform 0.3s ease, box-shadow 0.3s ease; display: flex; flex-direction: column; }
        .book-card:hover { transform: translateY(-8px); box-shadow: var(--shadow-lg); }
        .book-card .cover-image { height: 280px; background-color: #e5e7eb; background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; color: var(--text-muted); }
        .book-card .card-content { padding: 1.25rem; display: flex; flex-direction: column; flex-grow: 1; }
        .book-card .book-title { font-weight: 700; color: var(--text-primary); font-size: 1.1rem; line-height: 1.4; flex-grow: 1; }
        .book-card .book-author { font-weight: 500; color: var(--text-secondary); font-size: 0.9rem; margin-top: 0.5rem; }
        .book-card .admin-actions { border-top: 1px solid var(--border-color); padding: 0.75rem 1.25rem; background-color: #f9fafb; display: none; }
        
        .modal-overlay { transition: opacity 0.3s ease; }
        .modal-content { transition: transform 0.3s ease; }
        .admin-controls { display: none; }

        /* Custom Alert/Notification */
        #notification { transition: transform 0.5s ease-in-out, opacity 0.5s ease-in-out; }
    </style>
</head>
<body>
    
    <!-- Custom Notification/Alert -->
    <div id="notification" class="fixed top-5 right-5 w-80 p-4 rounded-lg shadow-lg bg-pmii-darkblue text-white z-50 transform translate-x-[150%] opacity-0">
        <p id="notification-message">Ini adalah pesan notifikasi!</p>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmation-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-sm">
            <div class="p-5 text-center">
                <i class="fas fa-exclamation-triangle text-4xl text-yellow-500 mb-4"></i>
                <h3 id="confirmation-title" class="text-lg font-semibold text-text-primary">Konfirmasi</h3>
                <p id="confirmation-message" class="text-sm text-text-secondary mt-2 mb-6">Apakah Anda yakin?</p>
            </div>
            <div class="flex justify-center items-center p-4 bg-gray-50 border-t">
                <button id="confirm-cancel-btn" class="btn btn-outline mr-3">Batal</button>
                <button id="confirm-ok-btn" class="btn btn-danger">Yakin</button>
            </div>
        </div>
    </div>


    <!-- Header -->
    <header class="internal-header py-3 sticky top-0 z-40">
        <div class="container mx-auto px-4 lg:px-8 flex justify-between items-center">
            <a href="#" class="flex items-center space-x-2.5">
                <img src="https://placehold.co/100x100/005c97/FFFFFF?text=P" alt="Logo PMII" class="h-9 w-9 rounded-full">
                <span class="text-sm md:text-base font-semibold logo-text">Perpustakaan Digital PMII</span>
            </a>
            <div class="flex items-center space-x-3 md:space-x-4">
                <span id="user-info" class="text-xs sm:text-sm font-medium hidden"></span>
                <a href="#" id="auth-info-header" class="btn btn-primary text-xs sm:text-sm">Login</a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8 lg:py-12">
        <div id="book-list-view">
            <div class="flex flex-wrap justify-between items-center gap-4 mb-8">
                <div>
                    <h1 class="text-3xl lg:text-4xl page-title">Buku Referensi</h1>
                    <p class="text-md text-text-muted mt-2">Koleksi buku-buku penting untuk kajian dan referensi.</p>
                </div>
                <button id="add-data-btn" class="btn btn-primary admin-controls">
                    <i class="fas fa-plus mr-2"></i> Tambah Buku
                </button>
            </div>

            <div class="mb-8 bg-white p-4 rounded-lg shadow-md">
                <div class="relative">
                    <input type="search" id="search-input" placeholder="Cari judul buku atau penulis..." class="w-full pl-10 pr-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <div class="absolute top-1/2 left-3 -translate-y-1/2"><i class="fas fa-search text-gray-400"></i></div>
                </div>
            </div>

            <div id="book-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6 md:gap-8"></div>
            <p id="no-data-message" class="text-center py-16 text-text-muted hidden">Belum ada data buku.</p>
        </div>
    </main>

    <!-- Modal for Adding/Editing Data -->
    <div id="data-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4 hidden modal-overlay">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-lg modal-content transform scale-95">
            <div class="flex justify-between items-center p-5 border-b">
                <h3 id="modal-title" class="text-xl font-bold text-text-primary">Tambah Buku Baru</h3>
                <button id="close-modal-btn" class="text-gray-400 hover:text-gray-600">&times;</button>
            </div>
            <form id="data-form" class="p-5 space-y-4">
                <input type="hidden" id="document-id">
                <div>
                    <label for="judul" class="block text-sm font-medium text-gray-700 mb-1">Judul Buku</label>
                    <input type="text" id="judul" name="judul" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500" required>
                </div>
                <div>
                    <label for="penulis" class="block text-sm font-medium text-gray-700 mb-1">Penulis</label>
                    <input type="text" id="penulis" name="penulis" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Sampul Buku</label>
                    <div class="mt-1 flex items-center space-x-4">
                        <img id="cover-preview" src="https://placehold.co/100x150/e0e0e0/9e9e9e?text=Preview" alt="Pratinjau Sampul" class="w-24 h-36 object-cover rounded-md bg-gray-100">
                        <div class="w-full">
                           <label for="cover-upload" class="cursor-pointer bg-white py-2 px-3 border border-gray-300 rounded-md shadow-sm text-sm leading-4 font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                               <span>Pilih file...</span>
                               <input id="cover-upload" name="cover-upload" type="file" class="sr-only" accept="image/png, image/jpeg, image/webp">
                           </label>
                           <p class="text-xs text-gray-500 mt-1">PNG, JPG, WEBP hingga 2MB.</p>
                        </div>
                    </div>
                </div>

                <div class="flex justify-end pt-4">
                    <button type="button" id="cancel-btn" class="btn btn-outline mr-3">Batal</button>
                    <button type="submit" id="submit-btn" class="btn btn-primary">Simpan</button>
                </div>
            </form>
        </div>
    </div>
    
    <footer class="bg-pmii-darkblue py-8 mt-16">
        <div class="container mx-auto px-4 text-center text-gray-300">
            <p class="text-sm">&copy; <span id="footer-year"></span> PC PMII UIN Sunan Gunung Djati. All Rights Reserved.</p>
        </div>
    </footer>

<script type="module">
    // NOTE: Firebase SDKs are not imported in this simulation version.
    // They can be re-added when connecting to a live database.

    document.addEventListener('DOMContentLoaded', () => {
        // --- STATE & MOCK DATA (SIMULATION) ---
        let isAdmin = false;
        let books = [
            { id: 1, title: 'Islam dan Gerakan Sosial', penulis: 'Dr. John Doe', cover: 'https://placehold.co/400x600/005c97/FFFFFF?text=Buku+1' },
            { id: 2, title: 'Teologi Pembebasan', penulis: 'Gustavo Gutiérrez', cover: 'https://placehold.co/400x600/fdd835/000000?text=Buku+2' },
            { id: 3, title: 'Madilog', penulis: 'Tan Malaka', cover: 'https://placehold.co/400x600/333333/FFFFFF?text=Buku+3' },
        ];

        // --- DOM ELEMENTS ---
        const userInfo = document.getElementById('user-info');
        const authHeader = document.getElementById('auth-info-header');
        const adminControls = document.querySelectorAll('.admin-controls');
        const bookGrid = document.getElementById('book-grid');
        const noDataMessage = document.getElementById('no-data-message');
        const searchInput = document.getElementById('search-input');
        
        const dataModal = document.getElementById('data-modal');
        const dataForm = document.getElementById('data-form');
        const docIdInput = document.getElementById('document-id');
        const submitBtn = document.getElementById('submit-btn');
        const coverUploadInput = document.getElementById('cover-upload');
        const coverPreview = document.getElementById('cover-preview');

        // --- NOTIFICATION & CONFIRMATION ---
        const notification = document.getElementById('notification');
        const notificationMessage = document.getElementById('notification-message');
        const confirmationModal = document.getElementById('confirmation-modal');
        let confirmCallback = null;

        function showAlert(message) {
            notificationMessage.textContent = message;
            notification.classList.remove('transform', 'translate-x-[150%]', 'opacity-0');
            notification.classList.add('translate-x-0', 'opacity-100');
            setTimeout(() => {
                notification.classList.add('transform', 'translate-x-[150%]', 'opacity-0');
            }, 3000);
        }

        function showConfirmation(title, message, callback) {
            document.getElementById('confirmation-title').textContent = title;
            document.getElementById('confirmation-message').textContent = message;
            confirmCallback = callback;
            confirmationModal.classList.remove('hidden');
        }

        document.getElementById('confirm-ok-btn').addEventListener('click', () => {
            if (confirmCallback) confirmCallback();
            confirmationModal.classList.add('hidden');
        });
        document.getElementById('confirm-cancel-btn').addEventListener('click', () => {
            confirmationModal.classList.add('hidden');
        });

        // --- AUTH SIMULATION ---
        function updateAuthUI() {
            if (isAdmin) {
                userInfo.textContent = 'Halo, Admin';
                userInfo.classList.remove('hidden');
                authHeader.textContent = 'Logout';
                authHeader.classList.add('logout-active');
                adminControls.forEach(el => el.style.display = 'inline-flex');
            } else {
                userInfo.classList.add('hidden');
                authHeader.textContent = 'Login';
                authHeader.classList.remove('logout-active');
                adminControls.forEach(el => el.style.display = 'none');
            }
            renderBooks();
        }

        // --- UI LOGIC ---
        function renderBooks() {
            const query = searchInput.value.toLowerCase();
            const filteredBooks = books.filter(book => 
                book.title.toLowerCase().includes(query) || book.penulis.toLowerCase().includes(query)
            );

            bookGrid.innerHTML = '';
            if (filteredBooks.length === 0) {
                noDataMessage.classList.remove('hidden');
                noDataMessage.textContent = query ? 'Tidak ada buku yang cocok.' : 'Belum ada data buku.';
            } else {
                noDataMessage.classList.add('hidden');
                filteredBooks.forEach(book => {
                    const card = document.createElement('div');
                    card.className = 'book-card';
                    card.innerHTML = `
                        <div class="cover-image" style="background-image: url('${book.cover || 'https://placehold.co/400x600/e0e0e0/9e9e9e?text=No+Cover'}')"
                             onerror="this.style.backgroundImage='url(https://placehold.co/400x600/e0e0e0/9e9e9e?text=Error)'">
                            ${!book.cover ? '<i class="fas fa-book-open fa-3x"></i>' : ''}
                        </div>
                        <div class="card-content">
                            <h3 class="book-title">${book.title}</h3>
                            <p class="book-author">${book.penulis}</p>
                        </div>
                        <div class="admin-actions p-3 text-right">
                             <button data-action="edit" data-id="${book.id}" class="text-yellow-600 hover:text-yellow-800 mr-3" title="Edit"><i class="fas fa-edit"></i></button>
                             <button data-action="delete" data-id="${book.id}" class="text-red-600 hover:text-red-800" title="Hapus"><i class="fas fa-trash"></i></button>
                        </div>
                    `;
                    bookGrid.appendChild(card);
                });
            }
            
            if (isAdmin) {
                bookGrid.querySelectorAll('.admin-actions').forEach(el => el.style.display = 'block');
            }
        }
        
        // --- FILE HANDLING ---
        function readFileAsBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = (error) => reject(error);
                reader.readAsDataURL(file);
            });
        }

        coverUploadInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                if (file.size > 2 * 1024 * 1024) { // 2MB limit
                    showAlert('Ukuran file terlalu besar. Maksimal 2MB.');
                    coverUploadInput.value = ''; // Reset input
                    return;
                }
                const reader = new FileReader();
                reader.onload = (event) => {
                    coverPreview.src = event.target.result;
                }
                reader.readAsDataURL(file);
            }
        });


        // --- CRUD SIMULATION ---
        async function handleFormSubmit(e) {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = 'Menyimpan...';

            const id = docIdInput.value;
            let coverData = document.getElementById('cover-preview').src; // Get existing or default preview src

            const file = coverUploadInput.files[0];
            if (file) {
                try {
                    coverData = await readFileAsBase64(file);
                } catch (error) {
                    console.error("Error reading file:", error);
                    showAlert("Gagal membaca file gambar.");
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Simpan';
                    return;
                }
            }
            
            const bookData = {
                title: document.getElementById('judul').value,
                penulis: document.getElementById('penulis').value,
                cover: coverData
            };

            if (id) {
                const index = books.findIndex(b => b.id == id);
                if (index !== -1) {
                    books[index] = { ...books[index], ...bookData };
                    showAlert('Buku berhasil diperbarui!');
                }
            } else {
                bookData.id = Date.now();
                books.unshift(bookData);
                showAlert('Buku baru berhasil ditambahkan!');
            }
            
            renderBooks();
            closeModal();
            
            submitBtn.disabled = false;
            submitBtn.textContent = 'Simpan';
        }

        // --- MODAL & EVENT LISTENERS ---
        function openModal(book = null) {
            dataForm.reset();
            coverPreview.src = 'https://placehold.co/100x150/e0e0e0/9e9e9e?text=Preview'; // Reset preview
            if (book) {
                document.getElementById('modal-title').textContent = 'Edit Buku';
                docIdInput.value = book.id;
                document.getElementById('judul').value = book.title;
                document.getElementById('penulis').value = book.penulis;
                if(book.cover) coverPreview.src = book.cover;
            } else {
                document.getElementById('modal-title').textContent = 'Tambah Buku Baru';
                docIdInput.value = '';
            }
            dataModal.classList.remove('hidden');
        }

        function closeModal() {
            dataModal.classList.add('hidden');
        }

        authHeader.addEventListener('click', (e) => {
            e.preventDefault();
            isAdmin = !isAdmin;
            updateAuthUI();
        });

        document.getElementById('add-data-btn').addEventListener('click', () => openModal());
        document.getElementById('close-modal-btn').addEventListener('click', closeModal);
        document.getElementById('cancel-btn').addEventListener('click', closeModal);
        dataForm.addEventListener('submit', handleFormSubmit);
        searchInput.addEventListener('input', renderBooks);
        
        bookGrid.addEventListener('click', (e) => {
            const target = e.target.closest('button');
            if (!target) return;

            const action = target.dataset.action;
            const id = Number(target.dataset.id);
            
            if (action === 'edit') {
                const bookToEdit = books.find(b => b.id === id);
                if (bookToEdit) openModal(bookToEdit);
            } else if (action === 'delete') {
                showConfirmation('Hapus Buku', 'Apakah Anda yakin ingin menghapus buku ini?', () => {
                    books = books.filter(b => b.id !== id);
                    renderBooks();
                    showAlert('Buku berhasil dihapus.');
                });
            }
        });

        // --- INITIALIZATION ---
        (function initialize() {
            document.getElementById('footer-year').textContent = new Date().getFullYear();
            updateAuthUI();
        })();
    });
</script>

</body>
</html>
